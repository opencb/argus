name: validation-data-load-cancer
variables:
  user_id: test
  project_id: validation2
  study_id: dataLoad2
tests:
  - id: setup
    path: /operation/variant/setup
    method: POST
    async: false
    steps:
      - id: variant_setup
        queryParams:
          study: ${user_id}@${project_id}:${study_id}
        bodyParams:
          expectedSamples: 1
          expectedFiles: 1
          fileType: GENOME_VCF
        validation:
          results:
            - compare('responses[0].results[0].options.expected_files_number', '1', 'eq')
            - compare('responses[0].results[0].options.expected_samples_number', '1', 'eq')
  - id: link
    path: /files/link
    method: POST
    async: false
    steps:
      - id: wgs_cancer_paired_vcf-link-somatic_snv
        queryParams:
          study: ${user_id}@${project_id}:${study_id}
        bodyParams:
          uri: /opt/opencga/variants/validation/validation_data_load/HCC1954_vs_HCC1954BL.annot.muts.caveman.vcf.gz
        validation:
          results:
            - match('responses[0].results[0].id', 'HCC1954_vs_HCC1954BL.annot.muts.caveman.vcf.gz')
            - list_equals('responses[0].results[0].sampleIds', '["HCC1954", "HCC1954BL"]', 'False')
      - id: wgs_cancer_paired_vcf-link-somatic_indel
        queryParams:
          study: ${user_id}@${project_id}:${study_id}
        bodyParams:
          uri: /opt/opencga/variants/validation/validation_data_load/HCC1954_vs_HCC1954BL.annot.pindel.vcf.gz
        validation:
          results:
            - match('responses[0].results[0].id', 'HCC1954_vs_HCC1954BL.annot.pindel.vcf.gz')
            - list_equals('responses[0].results[0].sampleIds', '["HCC1954", "HCC1954BL"]', 'False')
      - id: wgs_cancer_paired_vcf-link-somatic_sv
        queryParams:
          study: ${user_id}@${project_id}:${study_id}
        bodyParams:
          uri: /opt/opencga/variants/validation/validation_data_load/HCC1954_vs_HCC1954BL.annot.brass.vcf.gz
        validation:
          results:
            - match('responses[0].results[0].id', 'HCC1954_vs_HCC1954BL.annot.brass.vcf.gz')
            - list_equals('responses[0].results[0].sampleIds', '["HCC1954", "HCC1954BL"]', 'False')
      - id: wgs_cancer_paired_vcf-link-somatic_cnv
        queryParams:
          study: ${user_id}@${project_id}:${study_id}
        bodyParams:
          uri: /opt/opencga/variants/validation/validation_data_load/HCC1954.copynumber.caveman.vcf.gz
        validation:
          results:
            - match('responses[0].results[0].id', 'HCC1954.copynumber.caveman.vcf.gz')
            - list_equals('responses[0].results[0].sampleIds', '["HCC1954", "HCC1954BL"]', 'False')
      - id: wgs_cancer_paired_vcf-link-germline_snv
        queryParams:
          study: ${user_id}@${project_id}:${study_id}
        bodyParams:
          uri: /opt/opencga/variants/validation/validation_data_load/Strelka_HCC1954BL_variants.vcf.gz
        validation:
          results:
            - match('responses[0].results[0].id', 'Strelka_HCC1954BL_variants.vcf.gz')
            - list_equals('responses[0].results[0].sampleIds', '["HCC1954BL"]', 'False')
      - id: wgs_cancer_paired_vcf-link-germline_sv
        queryParams:
          study: ${user_id}@${project_id}:${study_id}
        bodyParams:
          uri: /opt/opencga/variants/validation/validation_data_load/Manta_HCC1954BL.diploidSV.vcf.gz
        validation:
          results:
            - match('responses[0].results[0].id', 'Manta_HCC1954BL.diploidSV.vcf.gz')
            - list_equals('responses[0].results[0].sampleIds', '["HCC1954BL"]', 'False')
  - id: index
    path: /operation/variant/index
    method: POST
    async: true
    steps:
      - id: wgs_cancer_paired_vcf-index-somatic_snv
        queryParams:
          study: ${user_id}@${project_id}:${study_id}
        bodyParams:
          file: HCC1954_vs_HCC1954BL.annot.muts.caveman.vcf.gz
          somatic: true
          loadMultiFileData: true
          loadArchive: no
        validation:
          results:
            - opencga_query('/files/search?study=${user_id}@${project_id}:${study_id}&name=HCC1954_vs_HCC1954BL.annot.muts.caveman.vcf.gz&include=internal', 'file_info')
            - match('<file_info>.responses[0].results[0].internal.variant.index.status.id', 'READY')
      - id: wgs_cancer_paired_vcf-index-somatic_indel
        queryParams:
          study: ${user_id}@${project_id}:${study_id}
        bodyParams:
          file: HCC1954_vs_HCC1954BL.annot.pindel.vcf.gz
          somatic: true
          loadMultiFileData: true
          loadArchive: no
          includeGenotypes: no
        validation:
          results:
            - opencga_query('/files/search?study=${user_id}@${project_id}:${study_id}&name=HCC1954_vs_HCC1954BL.annot.pindel.vcf.gz&include=internal', 'file_info')
            - match('<file_info>.responses[0].results[0].internal.variant.index.status.id', 'READY')
      - id: wgs_cancer_paired_vcf-index-somatic_sv
        queryParams:
          study: ${user_id}@${project_id}:${study_id}
        bodyParams:
          file: HCC1954_vs_HCC1954BL.annot.brass.vcf.gz
          somatic: true
          loadMultiFileData: true
          loadArchive: no
        validation:
          results:
            - opencga_query('/files/search?study=${user_id}@${project_id}:${study_id}&name=HCC1954_vs_HCC1954BL.annot.brass.vcf.gz&include=internal', 'file_info')
            - match('<file_info>.responses[0].results[0].internal.variant.index.status.id', 'READY')
      - id: wgs_cancer_paired_vcf-index-somatic_cnv
        queryParams:
          study: ${user_id}@${project_id}:${study_id}
        bodyParams:
          file: HCC1954.copynumber.caveman.vcf.gz
          somatic: true
          loadMultiFileData: true
          loadArchive: no
          includeGenotypes: no
        validation:
          results:
            - opencga_query('/files/search?study=${user_id}@${project_id}:${study_id}&name=HCC1954.copynumber.caveman.vcf.gz&include=internal', 'file_info')
            - match('<file_info>.responses[0].results[0].internal.variant.index.status.id', 'READY')
      - id: wgs_cancer_paired_vcf-index-germline_snv
        queryParams:
          study: ${user_id}@${project_id}:${study_id}
        bodyParams:
          file: Strelka_HCC1954BL_variants.vcf.gz
          loadMultiFileData: true
          loadArchive: no
        validation:
          results:
            - opencga_query('/files/search?study=${user_id}@${project_id}:${study_id}&name=Strelka_HCC1954BL_variants.vcf.gz&include=internal', 'file_info')
            - match('<file_info>.responses[0].results[0].internal.variant.index.status.id', 'READY')
      - id: wgs_cancer_paired_vcf-index-germline_sv
        queryParams:
          study: ${user_id}@${project_id}:${study_id}
        bodyParams:
          file: Manta_HCC1954BL.diploidSV.vcf.gz
          loadMultiFileData: true
          loadArchive: no
          includeGenotypes: no
        validation:
          results:
            - opencga_query('/files/search?study=${user_id}@${project_id}:${study_id}&name=Manta_HCC1954BL.diploidSV.vcf.gz&include=internal', 'file_info')
            - match('<file_info>.responses[0].results[0].internal.variant.index.status.id', 'READY')
  - id: cellbase_configure
    path: /operation/cellbase/configure
    method: POST
    async: false
    steps:
      - id: cellbase_configure
        queryParams:
          project: validation
        bodyParams:
          url: https://ws.zettagenomics.com/cellbase
          version: v5.8
          dataRelease: 7
          apiKey: ${cellbaseApiKey}
        validation:
          results:
            - opencga_query('/projects/search?id=validation', 'project_info')
            - match('<project_info>.responses[0].results[0].cellbase.url', 'https://ws.zettagenomics.com/cellbase')
            - match('<project_info>.responses[0].results[0].cellbase.version', 'v5.8')
            - match('<project_info>.responses[0].results[0].cellbase.dataRelease', '7')
  - id: annotation
    path: /operation/variant/annotation/index
    method: POST
    async: true
    steps:
      - id: wgs_cancer_paired_vcf-annotation
        queryParams:
          study: ${user_id}@${project_id}:${study_id}
        bodyParams: {}
        validation:
          results:
            - opencga_query('/files/search?study=${user_id}@${project_id}:${study_id}&name=HCC1954_vs_HCC1954BL.annot.muts.caveman.vcf.gz&include=internal', 'file_info')
            - match('<file_info>.responses[0].results[0].internal.variant.annotationIndex.status.id', 'READY')
            - opencga_query('/files/search?study=${user_id}@${project_id}:${study_id}&name=HCC1954_vs_HCC1954BL.annot.pindel.vcf.gz&include=internal', 'file_info')
            - match('<file_info>.responses[0].results[0].internal.variant.annotationIndex.status.id', 'READY')
            - opencga_query('/files/search?study=${user_id}@${project_id}:${study_id}&name=HCC1954_vs_HCC1954BL.annot.brass.vcf.gz&include=internal', 'file_info')
            - match('<file_info>.responses[0].results[0].internal.variant.annotationIndex.status.id', 'READY')
            - opencga_query('/files/search?study=${user_id}@${project_id}:${study_id}&name=HCC1954.copynumber.caveman.vcf.gz&include=internal', 'file_info')
            - match('<file_info>.responses[0].results[0].internal.variant.annotationIndex.status.id', 'READY')
            - opencga_query('/files/search?study=${user_id}@${project_id}:${study_id}&name=Strelka_HCC1954BL_variants.vcf.gz&include=internal', 'file_info')
            - match('<file_info>.responses[0].results[0].internal.variant.annotationIndex.status.id', 'READY')
            - opencga_query('/files/search?study=${user_id}@${project_id}:${study_id}&name=Manta_HCC1954BL.diploidSV.vcf.gz&include=internal', 'file_info')
            - match('<file_info>.responses[0].results[0].internal.variant.annotationIndex.status.id', 'READY')
  - id: variant_stats_index
    path: /operation/variant/stats/index
    method: POST
    async: true
    steps:
      - id: wgs_cancer_paired_vcf-variant_stats_index
        queryParams:
          study: ${user_id}@${project_id}:${study_id}
        bodyParams:
          cohort: ["ALL"]
        validation:
          results:
            - opencga_query('/analysis/variant/query?study=${user_id}@${project_id}:${study_id}&limit=1&skip=0', 'test_variant')
            - list_length('<test_variant>.responses[0].results[0].studies[0].stats', '1')
  - id: variant_secondary_annotation_index
    path: /operation/variant/secondary/annotation/index
    method: POST
    async: true
    steps:
      - id: wgs_cancer_paired_vcf-variant_secondary_annotation_index
        queryParams:
          study: ${user_id}@${project_id}:${study_id}
        bodyParams: {}
        validation:
          results:
            - opencga_query('/files/search?study=${user_id}@${project_id}:${study_id}&name=HCC1954_vs_HCC1954BL.annot.muts.caveman.vcf.gz&include=internal', 'file_info')
            - match('<file_info>.responses[0].results[0].internal.variant.secondaryAnnotationIndex.status.id', 'READY')
            - opencga_query('/files/search?study=${user_id}@${project_id}:${study_id}&name=HCC1954_vs_HCC1954BL.annot.pindel.vcf.gz&include=internal', 'file_info')
            - match('<file_info>.responses[0].results[0].internal.variant.secondaryAnnotationIndex.status.id', 'READY')
            - opencga_query('/files/search?study=${user_id}@${project_id}:${study_id}&name=HCC1954_vs_HCC1954BL.annot.brass.vcf.gz&include=internal', 'file_info')
            - match('<file_info>.responses[0].results[0].internal.variant.secondaryAnnotationIndex.status.id', 'READY')
            - opencga_query('/files/search?study=${user_id}@${project_id}:${study_id}&name=HCC1954.copynumber.caveman.vcf.gz&include=internal', 'file_info')
            - match('<file_info>.responses[0].results[0].internal.variant.secondaryAnnotationIndex.status.id', 'READY')
            - opencga_query('/files/search?study=${user_id}@${project_id}:${study_id}&name=Strelka_HCC1954BL_variants.vcf.gz&include=internal', 'file_info')
            - match('<file_info>.responses[0].results[0].internal.variant.secondaryAnnotationIndex.status.id', 'READY')
            - opencga_query('/files/search?study=${user_id}@${project_id}:${study_id}&name=Manta_HCC1954BL.diploidSV.vcf.gz&include=internal', 'file_info')
            - match('<file_info>.responses[0].results[0].internal.variant.secondaryAnnotationIndex.status.id', 'READY')
  - id: variant_secondary_sample_index
    path: /operation/variant/secondary/sample/index
    method: POST
    async: true
    steps:
      - id: wgs_cancer_paired_vcf-variant_secondary_sample_index
        queryParams:
          study: ${user_id}@${project_id}:${study_id}
        bodyParams:
          sample: ['all']
          overwrite: true
        validation:
          results:
            - opencga_query('/samples/search?study=${user_id}@${project_id}:${study_id}&id=HCC1954&include=internal', 'sample_info')
            - match('<sample_info>.responses[0].results[0].internal.variant.secondarySampleIndex.status.id', 'READY')
            - opencga_query('/samples/search?study=${user_id}@${project_id}:${study_id}&id=HCC1954BL&include=internal', 'sample_info')
            - match('<sample_info>.responses[0].results[0].internal.variant.secondarySampleIndex.status.id', 'READY')
  - id: variant_study_delete
    path: /operation/variant/study/delete
    method: POST
    async: true
    steps:
      - id: wgs_cancer_paired_vcf-variant_study_delete
        queryParams:
          study: ${user_id}@${project_id}:${study_id}
        bodyParams: {}
        validation:
          results:
            - opencga_query('/files/search?study=${user_id}@${project_id}:${study_id}&name=HCC1954_vs_HCC1954BL.annot.muts.caveman.vcf.gz&include=internal', 'file_info')
            - match('<file_info>.responses[0].results[0].internal.variant.index.status.id', 'NONE')
            - opencga_query('/files/search?study=${user_id}@${project_id}:${study_id}&name=HCC1954_vs_HCC1954BL.annot.pindel.vcf.gz&include=internal', 'file_info')
            - match('<file_info>.responses[0].results[0].internal.variant.index.status.id', 'NONE')
            - opencga_query('/files/search?study=${user_id}@${project_id}:${study_id}&name=HCC1954_vs_HCC1954BL.annot.brass.vcf.gz&include=internal', 'file_info')
            - match('<file_info>.responses[0].results[0].internal.variant.index.status.id', 'NONE')
            - opencga_query('/files/search?study=${user_id}@${project_id}:${study_id}&name=HCC1954.copynumber.caveman.vcf.gz&include=internal', 'file_info')
            - match('<file_info>.responses[0].results[0].internal.variant.index.status.id', 'NONE')
            - opencga_query('/files/search?study=${user_id}@${project_id}:${study_id}&name=Strelka_HCC1954BL_variants.vcf.gz&include=internal', 'file_info')
            - match('<file_info>.responses[0].results[0].internal.variant.index.status.id', 'NONE')
            - opencga_query('/files/search?study=${user_id}@${project_id}:${study_id}&name=Manta_HCC1954BL.diploidSV.vcf.gz&include=internal', 'file_info')
            - match('<file_info>.responses[0].results[0].internal.variant.index.status.id', 'NONE')
  - id: variant_prune
    path: /operation/variant/prune
    method: POST
    async: true
    steps:
      - id: wgs_cancer_paired_vcf-variant_prune
        bodyParams:
          project: validation
        validation:
          results:
            - opencga_query('/analysis/variant/query?study=${user_id}@${project_id}:${study_id}&limit=1&skip=0', 'test_variant')
            - is_empty('<test_variant>.responses[0].results')
  - id: unlink
    path: /files/{files}/unlink
    method: DELETE
    async: true
    steps:
      - id: wgs_cancer_paired_vcf-unlink-somatic_snv
        pathParams:
          files: HCC1954_vs_HCC1954BL.annot.muts.caveman.vcf.gz
        queryParams:
          study: ${user_id}@${project_id}:${study_id}
        validation:
          results:
            - opencga_query('/files/search?study=${user_id}@${project_id}:${study_id}&name=HCC1954_vs_HCC1954BL.annot.muts.caveman.vcf.gz', 'file_info')
            - is_empty('<file_info>.responses[0].results')
      - id: wgs_cancer_paired_vcf-unlink-somatic_indel
        pathParams:
          files: HCC1954_vs_HCC1954BL.annot.pindel.vcf.gz
        queryParams:
          study: ${user_id}@${project_id}:${study_id}
        validation:
          results:
            - opencga_query('/files/search?study=${user_id}@${project_id}:${study_id}&name=HCC1954_vs_HCC1954BL.annot.pindel.vcf.gz', 'file_info')
            - is_empty('<file_info>.responses[0].results')
      - id: wgs_cancer_paired_vcf-unlink-somatic_sv
        pathParams:
          files: HCC1954_vs_HCC1954BL.annot.brass.vcf.gz
        queryParams:
          study: ${user_id}@${project_id}:${study_id}
        validation:
          results:
            - opencga_query('/files/search?study=${user_id}@${project_id}:${study_id}&name=HCC1954_vs_HCC1954BL.annot.brass.vcf.gz', 'file_info')
            - is_empty('<file_info>.responses[0].results')
      - id: wgs_cancer_paired_vcf-unlink-somatic_cnv
        pathParams:
          files: HCC1954.copynumber.caveman.vcf.gz
        queryParams:
          study: ${user_id}@${project_id}:${study_id}
        validation:
          results:
            - opencga_query('/files/search?study=${user_id}@${project_id}:${study_id}&name=HCC1954.copynumber.caveman.vcf.gz', 'file_info')
            - is_empty('<file_info>.responses[0].results')
      - id: wgs_cancer_paired_vcf-unlink-germline_snv
        pathParams:
          files: Strelka_HCC1954BL_variants.vcf.gz
        queryParams:
          study: ${user_id}@${project_id}:${study_id}
        validation:
          results:
            - opencga_query('/files/search?study=${user_id}@${project_id}:${study_id}&name=Strelka_HCC1954BL_variants.vcf.gz', 'file_info')
            - is_empty('<file_info>.responses[0].results')
      - id: wgs_cancer_paired_vcf-unlink-germline_sv
        pathParams:
          files: Manta_HCC1954BL.diploidSV.vcf.gz
        queryParams:
          study: ${user_id}@${project_id}:${study_id}
        validation:
          results:
            - opencga_query('/files/search?study=${user_id}@${project_id}:${study_id}&name=Manta_HCC1954BL.diploidSV.vcf.gz', 'file_info')
            - is_empty('<file_info>.responses[0].results')
