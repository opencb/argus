#name: validation-export
tests:
  - id: export
    path: /analysis/variant/export/run
    method: POST
    async: true
    steps:
      - id: export_platinum_samples
        queryParams:
          study: germline:platinum
        bodyParams:
          limit: 10
          outputFileName: test_platinum_export
          includeSampleId: True
          ct: missense_variant,stop_lost
        bodyMatrixParams:
          sample: ['NA12877', 'NA12877:0/1;NA12889:1/1;NA12890:0/0']
          sampleData: ['NA12877:DP>20']
          outputFileFormat: [VCF, JSON]
        validation:
          results:
            - is_not_empty('responses[0].results[0].output')
            - store('responses[0].results[0].output[0].id', '$export_fid')
            - opencga_download('germline:platinum', '$export_fid')
            - check_export_file('$export_fid')
